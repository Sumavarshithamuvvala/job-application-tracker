<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Senior Profiles</title>

    <link rel="stylesheet" href="senior-profiles.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header>

        <a href="student-dashboard.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Dashboard

        </a>

        <h1>Senior Profiles</h1>

    </header>

    <!-- Search -->

    <section class="search-section">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by Senior Name...">

        </div>

    </section>

    <!-- Filters -->

    <section class="filter-section">

       <select id="companyFilter">
    <option value="All Companies">All Companies</option>
</select>

        <select id="roleFilter">
    <option value="All Roles">All Roles</option>
</select>

    <select id="branchFilter">
    <option value="All Branches">All Branches</option>
</select>

       <select id="batchFilter">
    <option value="All Batches">All Batches</option>
</select>

        <select id="sortFilter">

            <option>Sort By</option>
            <option>A-Z</option>
            <option>Newest Batch</option>
            <option>Oldest Batch</option>
            <option>Company</option>

        </select>

        <button id="resetFilters">

            <i class="fa-solid fa-rotate-left"></i>

            Reset

        </button>

    </section>

    <!-- Senior Profiles -->

    <section class="profiles-grid" id="profilesGrid">

        <!-- Cards will be loaded dynamically from Firebase -->

    </section>
        <!-- End of Profiles Grid -->

</div>

<!-- JavaScript -->

<script type="module" src="senior-profiles.js"></script>

</body>

</html>
