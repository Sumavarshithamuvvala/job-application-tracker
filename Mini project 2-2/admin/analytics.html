<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analytics Dashboard</title>

    <link rel="stylesheet" href="analytics.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="sidebar">

    <div class="logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Placement Portal</span>
    </div>

    <a href="admin-dashboard.html">
        <i class="fa-solid fa-house"></i>
        Dashboard
    </a>

    <a href="placements.html">
        <i class="fa-solid fa-briefcase"></i>
        Placements
    </a>

    <a href="students.html">
        <i class="fa-solid fa-user-graduate"></i>
        Student Records
    </a>

    <a href="analytics.html" class="active">
        <i class="fa-solid fa-chart-line"></i>
        Analytics
    </a>

</div>

    <!-- Main -->

    <div class="main">

        <div class="top">

            <h1>Placement Analytics Dashboard</h1>

        </div>

        <!-- Statistics -->

        <div class="cards">

            <div class="card">

                <i class="fa-solid fa-building"></i>

               <h2 id="totalCompanies">0</h2>
                <p>Total Companies</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-user-graduate"></i>

               <h2 id="studentsPlaced">0</h2>

                <p>Students Placed</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-indian-rupee-sign"></i>

                <h2 id="averagePackage">0</h2>

                <p>Average Package</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-trophy"></i>

                <h2 id="highestPackage">0</h2>

                <p>Highest Package</p>

            </div>

        </div>

       <!-- Charts -->

<div class="chartRow">

    <div class="chartCard">

        <h2>Placement by Company</h2>

        <canvas id="companyChart"></canvas>

    </div>

    <div class="chartCard">

        <h2>Branch-wise Placements</h2>

        <canvas id="branchChart"></canvas>

    </div>

</div>
      <!-- Summary -->

<div class="summary">

    <h2>Placement Insights</h2>

    <div class="summaryGrid">

        <div>

            <h3>🏆 Top Hiring Company</h3>

            <p id="topHiringCompany">-</p>

        </div>

    </div>

</div>

    <!-- Chart.js -->

   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module" src="analytics.js"></script>
</body>

</html>
