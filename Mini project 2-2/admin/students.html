<!DOCTYPE html>
<html>
<head>
    <title>Student Records | Job Tracker</title>

    <link rel="stylesheet" href="students.css">

    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-briefcase"></i>
            <span>Job Tracker</span>
        </div>

        <nav>

            <a href="admin-dashboard.html">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <a href="placements.html">
                <i class="fa-solid fa-briefcase"></i>
                Placements
            </a>

            <a href="students.html" class="active">
                <i class="fa-solid fa-users"></i>
                Student Records
            </a>

            <a href="analytics.html">
                <i class="fa-solid fa-chart-pie"></i>
                Analytics
            </a>

            <a href="settings.html">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>

        </nav>

    </div>

    <!-- Main -->

    <div class="main">

        <div class="top">

            <div>

                <h1>Student Records</h1>

                <p>View all registered students using Job Tracker</p>

            </div>

        </div>

        <!-- Search -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="search"
                placeholder="Search students by name or mail id..."
            >

        </div>

        <!-- Table -->

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>Name</th>

                        <th>College Mail ID</th>

                        <th>Branch</th>

                        <th>Passing Year</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>

    <script type="module" src="students.js"></script>

</body>
</html>
